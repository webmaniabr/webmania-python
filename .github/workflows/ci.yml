name: Installed Python packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-wheel-and-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked build and verification tools
        run: python -m pip install -r requirements-dev.lock
      - name: Build and verify wheel and sdist in empty consumers (loopback fixtures only)
        run: python scripts/test_installed.py --artifacts artifacts/ci
